name: Cập nhật dữ liệu & dashboard

on:
  schedule:
    # 09:00 UTC = 16:00 giờ VN (sau khi thị trường đóng cửa), thứ 2 - thứ 6
    - cron: "0 9 * * 1-5"
  workflow_dispatch:        # cho phép bấm chạy tay trên GitHub
  push:                     # chạy lại ngay khi sửa code pipeline
    paths:
      - "smart_money/**"
      - "market_data/**"
      - "updat_stock.py"
      - ".github/workflows/cap-nhat.yml"

permissions:
  contents: write           # để commit dữ liệu mới vào repo
  pages: write
  id-token: write

concurrency:
  group: cap-nhat
  cancel-in-progress: false

jobs:
  cap-nhat-du-lieu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      # Kho giá không nằm trong repo: khôi phục từ cache để chỉ tải ngày còn thiếu
      - name: Khôi phục kho giá
        uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      # Dùng updat_stock.py (không phải run.py) để job BÁO LỖI khi lấy dữ liệu thất bại,
      # GitHub sẽ gửi email và dashboard cũ không bị ghi đè bằng dữ liệu hỏng.
      - name: Chạy phân tích
        run: python updat_stock.py

      - name: Kiểm tra dữ liệu hôm nay có mã được chấm điểm
        run: |
          NGAY=$(TZ=Asia/Ho_Chi_Minh date +%F)
          python - "$NGAY" <<'PY'
          import json, sys, pathlib
          ngay = sys.argv[1]
          f = pathlib.Path(f"anal_stock/public/data/runs/{ngay}.json")
          if not f.exists():
              sys.exit(f"Thiếu file dữ liệu ngày {ngay}")
          meta = json.loads(f.read_text(encoding="utf-8"))["meta"]
          n = meta.get("tickers_scored") or 0
          print(f"{ngay}: {n} mã được chấm điểm | cảnh báo: {meta.get('warnings')}")
          if n < 10:
              sys.exit(f"Chỉ có {n} mã được chấm điểm — dữ liệu hỏng, không deploy")
          PY

      - name: Lưu kết quả vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smart_money_snapshots data/smart_money_output anal_stock/public/data
          git diff --staged --quiet && echo "Không có thay đổi" || git commit -m "Cập nhật dữ liệu $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: anal_stock/public

  dang-dashboard:
    needs: cap-nhat-du-lieu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
