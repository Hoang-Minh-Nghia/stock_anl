name: Dò nguồn dữ liệu gọi được từ GitHub

on:
  push:
    paths:
      - ".github/workflows/kiem-tra-nguon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  do-nguon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: So sánh từng kịch bản tải Vietcap
        run: |
          python - <<'PY' 2>&1 | tee ket-qua-do-nguon.txt
          import time
          from concurrent.futures import ThreadPoolExecutor
          from market_data import price_store as ps

          MA = ["HPG","VCB","FPT","MBB","VNM","SSI","MWG","HDB","CTG","VPB","ACB","TCB"]

          def thu(ten, tickers, start, workers):
              t0 = time.time()
              if workers == 1:
                  kq = [ps.fetch_vietcap(m, start, "2026-09-26") for m in tickers]
              else:
                  with ThreadPoolExecutor(max_workers=workers) as ex:
                      kq = list(ex.map(lambda m: ps.fetch_vietcap(m, start, "2026-09-26"), tickers))
              loi = sum(1 for d in kq if d is None)
              nen = max((len(d) for d in kq if d is not None), default=0)
              print(f"{ten:52} loi={loi}/{len(tickers)} | nen toi da={nen} | {time.time()-t0:.1f}s")

              
          thu("Tuan tu,  tu 2024 (2 nam)", MA, "2024-01-01", 1)
          thu("Tuan tu,  tu 2000 (day du)", MA, "2000-01-01", 1)
          thu("3 luong,  tu 2000 (day du)", MA, "2000-01-01", 3)
          thu("6 luong,  tu 2000 (day du)", MA, "2000-01-01", 6)
          thu("6 luong,  tu 2024 (2 nam)", MA, "2024-01-01", 6)
          PY

      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ket-qua-do-nguon.txt
          git commit -m "Ket qua do nguon (qua code du an)" || echo "khong doi"
          git pull --rebase --autostash && git push
