name: Dò nguồn dữ liệu gọi được từ GitHub

on:
  push:
    paths:
      - ".github/workflows/kiem-tra-nguon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  do-nguon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Dò bằng chính code của dự án
        run: |
          python - <<'PY' 2>&1 | tee ket-qua-do-nguon.txt
          import time, json, requests
          from market_data import price_store as ps

          print("IP:", requests.get("https://api.ipify.org", timeout=10).text)
          print()

          for ten, ham in (("SSI", ps.fetch_ssi), ("Vietcap", ps.fetch_vietcap)):
              t0 = time.time()
              df = ham("HPG", "2026-01-01", "2026-09-26")
              print(f"{ten:8} 1 ma: {'None (loi/chan)' if df is None else str(len(df)) + ' nen'} trong {time.time()-t0:.1f}s")

          # Thu goi nhieu ma lien tiep de phat hien chan theo tan suat
          ma_list = ["HPG","VCB","FPT","MBB","VNM","SSI","MWG","HDB","CTG","VPB","ACB","TCB"]
          for ten, ham in (("Vietcap", ps.fetch_vietcap), ("SSI", ps.fetch_ssi)):
              t0 = time.time(); ok = loi = 0
              for m in ma_list:
                  df = ham(m, "2026-01-01", "2026-09-26")
                  if df is None: loi += 1
                  else: ok += 1
              print(f"{ten:8} {len(ma_list)} ma tuan tu: ok={ok} loi={loi} trong {time.time()-t0:.1f}s")

          # Giong het pipeline: song song 6 luong, lich su day du
          ps.reset_sources()
          t0 = time.time()
          frames, stats = ps.update_many(ma_list, workers=6)
          print(f"\nupdate_many 6 luong, lich su day du: {time.time()-t0:.1f}s")
          print("  ket qua:", {k: len(v) for k, v in stats.items()})
          print("  nguon:", ps.source_report())
          PY

      - name: Lưu kết quả
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ket-qua-do-nguon.txt
          git commit -m "Ket qua do nguon (qua code du an)" || echo "khong doi"
          git pull --rebase --autostash && git push
