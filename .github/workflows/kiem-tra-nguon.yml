name: Dò nguồn dữ liệu gọi được từ GitHub

on:
  push:
    paths:
      - ".github/workflows/kiem-tra-nguon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  do-nguon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Thử từng nguồn dữ liệu
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          TO=$(date +%s); FROM=$((TO - 3000000))
          OUT=ket-qua-do-nguon.txt
          echo "Do luc: $(date -u) | IP: $(curl -s --max-time 10 https://api.ipify.org) | $(curl -s --max-time 10 https://ipinfo.io/country)" > $OUT
          echo "" >> $OUT

          thu() {
            ten="$1"; shift
            ket=$(curl -s -o /tmp/body -w "%{http_code}|%{size_download}|%{time_total}" --max-time 25 -A "$UA" "$@" 2>/dev/null || echo "LOI|0|0")
            dau=$(head -c 160 /tmp/body | tr -d '\n' | tr -d '\r')
            printf "%-28s %s\n    %s\n" "$ten" "$ket" "$dau" >> $OUT
          }

          thu "SSI-history"   "https://iboard-api.ssi.com.vn/statistics/charts/history?resolution=1D&symbol=HPG&from=$FROM&to=$TO"
          thu "SSI-time"      "https://iboard-query.ssi.com.vn/system/time"
          thu "TCBS-bars"     "https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/bars-long-term?ticker=HPG&type=stock&resolution=D&to=$TO&countBack=300"
          thu "VNDIRECT"      "https://finfo-api.vndirect.com.vn/v4/stock_prices?sort=date&q=code:HPG~date:gte:2026-08-01&size=20"
          thu "Vietcap-chart" -X POST -H "Content-Type: application/json" \
              -d "{\"timeFrame\":\"ONE_DAY\",\"symbols\":[\"HPG\"],\"from\":$FROM,\"to\":$TO}" \
              "https://trading.vietcap.com.vn/api/chart/OHLCChart/gap"
          thu "FMarket"       -X POST -H "Content-Type: application/json" -H "Referer: https://fmarket.vn/" \
              -d '{"types":["NEW_FUND","TRADING_FUND"],"page":1,"pageSize":5,"isIpo":false,"issuerIds":[],"fundAssetTypes":[],"bondRemainPeriods":[],"searchField":"","isBuyByReward":false,"thirdAppIds":[],"sortOrder":"DESC","sortField":"navTo6Months"}' \
              "https://api.fmarket.vn/res/products/filter"
          thu "Simplize"      "https://simplize.vn/"
          thu "CafeF-history" "https://s.cafef.vn/Ajax/PageNew/DataHistory/PriceHistory.ashx?Symbol=HPG&StartDate=&EndDate=&PageIndex=1&PageSize=20"

          cat $OUT

      - name: Lưu kết quả vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ket-qua-do-nguon.txt
          git commit -m "Ket qua do nguon du lieu" || echo "khong doi"
          git pull --rebase --autostash && git push
